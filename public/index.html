<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ - CotamWeb</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>CotamWeb Store</h1>
        <div id="user-box">
            <a href="login.html">Đăng nhập</a>
        </div>
    </header>
	<div class="container">
        <h1>Chào mừng đến với COTAMWEB_V1</h1>
        <p>Website đã sẵn sàng hoạt động trên Cloudflare Pages!</p>
    </div>
    <script src="js/main.js"></script>
    <script>
        // Kiểm tra xem đã đăng nhập chưa khi tải trang
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
            document.getElementById('user-box').innerHTML = `
                <img src="${user.picture}" class="avatar">
                <span>${user.name}</span>
                <button onclick="logout()">Đăng xuất</button>
            `;
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.reload();
        }
    </script>
</body>
</html>
