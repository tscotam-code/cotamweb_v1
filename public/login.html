<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực - CotamWeb</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google OAuth SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="auth-body">
    <!-- Cấu hình Google Sign-In SDK -->
    <div id="g_id_onload"
         data-client_id="52215632275-esbtjt5b55d6osdpv8e81l6ifrj5n6a7.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false"
         data-use_fedcm_for_prompt="false">
    </div>
	
	<div class="g_id_signin"
     data-type="standard"
     data-size="large"
     data-theme="outline"
     data-text="sign_in_with"
     data-shape="rectangular"
     data-logo_alignment="left">
	</div>
	<!-- Cấu hình Google Sign-In SDK -->
    <div class="auth-wrapper">
        <div class="auth-card">
            
            <!-- HEADER SWAP TABS -->
            <div class="auth-header">
                <h1 id="tab-login-title" class="active" onclick="switchTab('login')">Login</h1>
                <h1 id="tab-signup-title" onclick="switchTab('signup')">Sign Up</h1>
            </div>

            <!-- AVATAR / ICON PLACEHOLDER -->
            <div class="avatar-container">
                <div class="avatar-circle" id="avatar-preview">
                    <i class="fa-regular fa-user" id="avatar-icon"></i>
                </div>
            </div>

            <!-- FORM ĐĂNG NHẬP (LOGIN) -->
            <form id="login-form" class="auth-form active-form" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <input type="text" id="login-input" placeholder="Username or email address" required>
                </div>
                <div class="input-group">
                    <input type="password" id="login-password" placeholder="Password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('login-password', this)"></i>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-check"></i> LOG IN
                </button>

                <div class="social-section">
                    <p>Login with</p>
                    <div class="social-icons">
                        <button type="button" class="btn-social google" onclick="triggerGoogleLogin()"><i class="fa-brands fa-google-plus-g"></i></button>
                        <button type="button" class="btn-social github"><i class="fa-brands fa-github"></i></button>
                        <button type="button" class="btn-social twitter"><i class="fa-brands fa-twitter"></i></button>
                        <button type="button" class="btn-social facebook"><i class="fa-brands fa-facebook-f"></i></button>
                    </div>
                </div>
            </form>

            <!-- FORM ĐĂNG KÝ (SIGN UP) -->
            <form id="signup-form" class="auth-form" onsubmit="handleSignUp(event)">
                <div class="input-group">
                    <input type="email" id="signup-email" placeholder="Email address" required>
                </div>
                <div class="input-group">
                    <input type="text" id="signup-username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <input type="password" id="signup-password" placeholder="Password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('signup-password', this)"></i>
                </div>
                <div class="input-group">
                    <input type="password" id="signup-repeat-password" placeholder="Repeat Password" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePasswordVisibility('signup-repeat-password', this)"></i>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-check"></i> SIGN UP
                </button>

                <div class="terms-link">
                    <a href="#">Terms of Service</a>
                </div>
            </form>

        </div>
    </div>

    <!-- Tệp JavaScript chứa logic xử lý Tab & Form -->
    <script src="js/auth.js"></script>

    <!-- Logic Xử lý Đăng Nhập Google -->
    <script>
        // Kích hoạt cửa sổ đăng nhập Google khi bấm nút biểu tượng Google
        function triggerGoogleLogin() {
            if (window.google && window.google.accounts && window.google.accounts.id) {
                google.accounts.id.prompt();
            } else {
                alert("Đang tải SDK Google, vui lòng thử lại sau giây lát.");
            }
        }

        // Hàm Callback nhận token khi người dùng chọn tài khoản Google thành công
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            console.log("Dữ liệu Google User:", responsePayload);

            // Gửi dữ liệu về backend Worker API để lưu/cập nhật trong D1
            fetch('/api/auth/social', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: responsePayload.sub,
                    name: responsePayload.name,
                    email: responsePayload.email,
                    avatar: responsePayload.picture,
                    provider: 'google'
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('Đăng nhập Google thành công!');
                    window.location.href = '/';
                } else {
                    alert('Không thể lưu thông tin: ' + (data.error || data.message));
                }
            })
            .catch(err => {
                console.error('Lỗi API:', err);
                alert('Lỗi kết nối máy chủ!');
            });
        }

        // Hàm hỗ trợ giải mã mã thông báo JWT
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
